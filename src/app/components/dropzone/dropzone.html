<div
  class="dropzone"
  [class.drag-over]="isDragOver()"
  [class.pointer-events-none]="disabled()"
  [class.opacity-60]="disabled()"
  (click)="!disabled() && fileInput.click()"
  (dragover)="handleDragOver($event)"
  (dragleave)="handleDragLeave()"
  (drop)="handleDrop($event)"
>
  <input
    #fileInput
    type="file"
    hidden
    [accept]="accept()"
    [disabled]="disabled()"
    (change)="handleFileChange($event)"
  />

  <span class="mat-icon lg text-primary">cloud_upload</span>
  <div class="serif dropzone-title">拖曳檔案至此</div>
  <div class="mono mt-1 text-[11px] tracking-[0.1em] text-ink-muted">
    @if (selectedFileName()) {
      已選擇：{{ selectedFileName() }}
    } @else if (isDragOver()) {
      放開以上傳檔案
    } @else {
      {{ hint() }}
    }
  </div>

  <div class="absolute left-2.5 top-2 font-mono text-[9px] tracking-[0.2em] text-ink-faint">
    DROP ZONE
  </div>
</div>
