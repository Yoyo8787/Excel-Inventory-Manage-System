<aside class="sidenav">
  <div class="sidenav-head">
    <div class="flex items-center gap-2.5">
      <div class="flex size-7.5 shrink-0 items-center justify-center rounded-lg bg-primary text-white">
        <span class="mat-icon sm">inventory_2</span>
      </div>
      <div class="leading-[1.2]">
        <div class="sidenav-brand-title">Excel 庫存</div>
      </div>
    </div>
  </div>

  <nav class="sidenav-list">
    @for (item of menuItems; track item.route) {
      <button
        class="nav-item"
        [class.active]="layoutService.page() === item.route"
        (click)="layoutService.setPage(item.route)"
      >
        <span class="mat-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </button>
    }
  </nav>

  <div class="sidenav-foot">
    <div class="doc-no text-[10.5px] leading-[1.7]">
      <div>單機版 · 本機 Workbook</div>
      <div>Author Yoyo8787</div>
    </div>
  </div>
</aside>
