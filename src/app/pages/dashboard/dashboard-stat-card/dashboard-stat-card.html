<div class="file-card stat-card">
  <div class="cls-stripe h-0.75">
    <span [class]="stat().tone === 'red' ? 'red' : 'ink'"></span>
    <span [class]="stat().tone === 'ochre' ? 'ochre' : 'ink'"></span>
    <span [class]="stat().tone === 'green' ? 'green' : 'ink'"></span>
    <span [class]="stat().tone === 'blue' ? 'blue' : 'ink'"></span>
  </div>
  <div class="px-4.5 py-4">
    <div class="eyebrow">{{ stat().label }}</div>
    <div class="display-title stat-value">
      {{ stat().valueStr }}
    </div>
    <div class="mt-3.5">
      <div class="mono text-[11px] text-ink-muted">{{ stat().sub }}</div>
    </div>
  </div>
</div>
