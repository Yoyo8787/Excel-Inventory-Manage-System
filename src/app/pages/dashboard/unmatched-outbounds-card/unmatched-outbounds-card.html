<div class="file-card" style="margin-top: 24px; border-top: 3px double var(--danger)">
  <div
    class="file-card-head"
    style="background: linear-gradient(180deg, rgba(184, 80, 80, 0.07), var(--surface))"
  >
    <div>
      <div class="eyebrow" style="color: var(--danger)">ALERT · 配對警示</div>
      <div class="file-card-title" style="font-size: 20px">
        未配對出貨
        <span class="mono" style="font-size: 13px; color: var(--danger); margin-left: 8px">
          {{ outbounds().length }} rows
        </span>
      </div>
    </div>
    <button class="btn btn-sm btn-primary" (click)="gotoRequested.emit()">
      <span class="mat-icon sm">link</span>前往配對
    </button>
  </div>
  <div class="file-card-body" style="padding: 0">
    <div class="dashboard-table-scroll dashboard-table-scroll-sm">
      <table class="ledger-table">
        <thead>
          <tr>
            <th class="row-num">列</th>
            <th>商品名稱</th>
            <th>商品款式</th>
            <th>收件人</th>
            <th class="num" style="width: 70px">數量</th>
          </tr>
        </thead>
        <tbody>
          @for (u of outbounds(); track u.outboundId; let i = $index) {
            <tr>
              <td class="row-num">{{ (i + 1).toString().padStart(3, '0') }}</td>
              <td>{{ u.productName }}</td>
              <td>{{ u.productStyle || '空白' }}</td>
              <td>{{ u.recipientName }}</td>
              <td class="num">{{ u.quantity }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
