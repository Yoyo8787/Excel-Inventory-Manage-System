<div class="file-card alert-card mt-6">
  <div class="file-card-head alert-card-head">
    <div>
      <div class="eyebrow text-error">ALERT · 庫存警示</div>
      <div class="file-card-title text-xl">
        低庫存品項
        <span class="mono ml-2 text-[13px] text-error">
          {{ products().length }} items
        </span>
      </div>
    </div>
    <button class="btn btn-sm btn-primary" (click)="gotoRequested.emit()">
      <span class="mat-icon sm">link</span>前往查看
    </button>
  </div>
  <div class="file-card-body p-0">
    <div class="dashboard-table-scroll dashboard-table-scroll-sm">
      <table class="ledger-table">
        <thead>
          <tr>
            <th class="row-num">列</th>
            <th>商品名稱</th>
            <th>商品款式</th>
            <th class="num w-30">目前庫存</th>
            <th class="num w-30">安全庫存量</th>
          </tr>
        </thead>
        <tbody>
          @for (p of products(); track p.key; let i = $index) {
            <tr>
              <td class="row-num">{{ (i + 1).toString().padStart(3, '0') }}</td>
              <td>{{ p.productName }}</td>
              <td>{{ p.productStyle }}</td>
              <td class="num">{{ p.onHand }}</td>
              <td class="num">{{ threshold() }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
