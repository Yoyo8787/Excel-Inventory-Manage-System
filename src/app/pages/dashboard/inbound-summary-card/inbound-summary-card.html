<div class="file-card">
  <div class="file-card-head">
    <div>
      <div class="eyebrow">進貨概況</div>
      <div class="file-card-title">入庫紀錄</div>
    </div>
  </div>
  <div class="file-card-body">
    <div class="summary-row">
      <span>進貨紀錄總筆數</span>
      <span class="mono">{{ inboundCount() }} 筆</span>
    </div>
    <div class="summary-row">
      <span>進貨總件數</span>
      <span class="mono">{{ totalQty().toLocaleString() }} 件</span>
    </div>
  </div>
</div>
