<div class="fade-in">
  <div class="masthead">
    <div class="masthead-left">
      <div>
        <span class="eyebrow">Control Panel — Daily Brief</span>
        <h2 class="display-title page-title">
          控制面板
        </h2>
      </div>
    </div>
    <div class="masthead-right">
      <div class="doc-no">{{ state().meta.datasetName }}</div>
    </div>
  </div>

  <div class="grid-4 gap-6 mt-5.5">
    @for (s of stats(); track s.label) {
      <dashboard-stat-card [stat]="s" />
    }
  </div>

  @if (lowStockProducts().length > 0) {
    <low-stock-card
      [products]="lowStockProducts()"
      [threshold]="state().settings.defaultLowStockThreshold"
      (gotoRequested)="goto.emit('products')"
    />
  }

  @if (unmatchedOutbounds().length > 0) {
    <unmatched-outbounds-card
      [outbounds]="unmatchedOutbounds()"
      (gotoRequested)="goto.emit('products')"
    />
  }

  <recent-outbounds-card [outbounds]="recentOutbounds()" (gotoRequested)="goto.emit('orders')" />

  <div class="grid-2 gap-6 mt-6">
    <inventory-summary-card
      [inventoryCount]="inventorySnapshots().length"
      [mappingCount]="state().mappings.length"
      [unmatchedCount]="unmatchedOutbounds().length"
    />

    <inbound-summary-card [inboundCount]="state().inbounds.length" [totalQty]="inboundTotalQty()" />
  </div>

  <inventory-snapshot-card
    [items]="inventorySnapshots()"
    [threshold]="state().settings.defaultLowStockThreshold"
  />
</div>
