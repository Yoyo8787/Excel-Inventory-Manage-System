<div class="fade-in">
  <div class="masthead">
    <div class="masthead-left">
      <div>
        <span class="eyebrow">Goods Receipt - Inbound</span>
        <h2 class="display-title page-title">
          進貨作業
        </h2>
      </div>
    </div>
    <div class="masthead-right"><div class="doc-no">INBOUND</div></div>
  </div>

  <div class="grid-3 gap-6 inbound-entry-grid mt-5.5">
    <inbound-upload-card
      [busy]="busy()"
      [summary]="importSummary()"
      (fileSelected)="handleInboundWorkbookSelected($event)"
    />

    <inbound-manual-card
      [lines]="lines()"
      [productNameOptions]="productNameOptions()"
      [productStyleOptions]="productStyleOptions()"
      [activeLineCount]="activeLineCount()"
      [totalQty]="totalQty()"
      (lineUpdated)="updateLine($event.index, $event.key, $event.value)"
      (lineAdded)="addLine()"
      (lineRemoved)="rmLine($event)"
      (submitted)="submit()"
    />
  </div>

  <inbound-history-card
    [totalCount]="state().inbounds.length"
    [batchCount]="batches().length"
    [sections]="inboundBatchSections()"
    [confirmImportedAt]="confirmImportedAt()"
    (removeRequested)="requestRemoveBatch($event)"
    (removeCanceled)="cancelRemoveBatch()"
    (removeConfirmed)="removeBatch($event)"
  />
</div>
