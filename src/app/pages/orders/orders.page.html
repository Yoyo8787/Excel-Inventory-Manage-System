<div class="fade-in">
  <div class="masthead">
    <div class="masthead-left">
      <div>
        <span class="eyebrow">Outbound — Import &amp; Reconcile</span>
        <h2 class="display-title page-title">
          出貨匯入
        </h2>
      </div>
    </div>
    <div class="masthead-right"><div class="doc-no">OUTBOUND</div></div>
  </div>

  <div class="grid-3 gap-6 outbound-entry-grid mt-5.5">
    <outbound-upload-card [busy]="busy()" (fileSelected)="handleOutboundWorkbookSelected($event)" />
    <outbound-result-card [summary]="importSummary()" />
  </div>

  <outbound-history-card
    [totalCount]="state().outbounds.length"
    [batchCount]="batches().length"
    [sections]="outboundBatchSections()"
    [confirmImportedAt]="confirmImportedAt()"
    (removeRequested)="requestRemoveBatch($event)"
    (removeCanceled)="cancelRemoveBatch()"
    (removeConfirmed)="removeBatch($event)"
  />
</div>
