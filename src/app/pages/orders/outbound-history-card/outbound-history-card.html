<div class="file-card mt-6">
  <div class="file-card-head">
    <div>
      <div class="eyebrow">LEDGER · 全部出貨</div>
      <div class="file-card-title">出貨紀錄</div>
    </div>
    <span class="doc-no">{{ totalCount() }} 筆 · {{ batchCount() }} 批</span>
  </div>

  @if (sections().length === 0) {
    <div class="file-card-body empty-state py-12">
      <span class="mat-icon lg mb-3 block text-ink-faint"
        >local_shipping</span
      >
      <div class="mono empty-state-title">
        — 尚無出貨紀錄 —
      </div>
      <div class="margin-note mt-2">上傳出貨 Excel 即可建立出貨紀錄</div>
    </div>
  } @else {
    <div class="file-card-body outbound-batch-list">
      @for (section of sections(); track section.importedAt) {
        <outbound-batch-section
          [section]="section"
          [confirmImportedAt]="confirmImportedAt()"
          (removeRequested)="removeRequested.emit($event)"
          (removeCanceled)="removeCanceled.emit()"
          (removeConfirmed)="removeConfirmed.emit($event)"
        />
      }
    </div>
  }
</div>
