<div class="w-140 max-w-[92vw] overflow-hidden rounded-(--r-lg) bg-surface">
  <div class="cls-stripe h-1.25">
    <span class="red"></span><span class="ochre"></span><span class="green"></span>
    <span class="blue"></span><span class="ink"></span>
  </div>
  <div class="relative px-9 pb-7.5 pt-8">
    <div class="doc-no mb-2.5">FORM № 2026 / Ⅰ / 0422 · INITIALIZATION</div>
    <h1 class="display-title init-title">初始化資料</h1>
    <div class="eyebrow">Ledger 92 · Inventory Manager · v2.6</div>

    <p class="mt-4 text-sm leading-[1.8] text-ink-soft">
      歡迎回到庫存帳本。請選擇開啟方式，您可以建立全新的空白帳簿，
      或繼續載入既有的 Workbook 檔案。
    </p>

    <div class="divider-ornament my-5"><span>❦</span></div>

    <div class="grid-2 gap-6">
      <button class="init-option" (click)="createDataset()" [disabled]="busy()">
        <span class="stamp round shrink-0 text-[10px]">空白<br>NEW</span>
        <div class="flex-1 text-left">
          <div class="serif text-base font-bold">建立空白資料</div>
          <div class="mono mt-1 text-[11px] text-ink-muted">
            從零開始 · 產生預設範本
          </div>
        </div>
        <span class="mat-icon text-ink-muted">arrow_forward</span>
      </button>

      <button class="init-option" (click)="systemFileInput.click()" [disabled]="busy()">
        <span class="stamp round green shrink-0 text-[10px]">載入<br>LOAD</span>
        <div class="flex-1 text-left">
          <div class="serif text-base font-bold">載入資料庫 Excel</div>
          <div class="mono mt-1 text-[11px] text-ink-muted">
            繼續既有 Workbook · .xlsx / .xls
          </div>
        </div>
        <span class="mat-icon text-ink-muted">arrow_forward</span>
      </button>
    </div>

    <input
      #systemFileInput
      type="file"
      hidden
      accept=".xlsx,.xls"
      (change)="handleSystemWorkbookSelected($event)"
    />
  </div>
</div>
